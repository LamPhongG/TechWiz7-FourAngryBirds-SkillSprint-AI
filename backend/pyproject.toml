[project]
name = "skillsprint-backend"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 130

[tool.ruff.lint]
select = ["F", "E9", "B", "UP", "SIM", "I"]

[tool.ruff.lint.isort]
# backend/alembic/ holds our migrations; the import `alembic` is still the third-party package.
known-third-party = ["alembic"]
known-first-party = ["app", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = [
    # google-genai 2.25 uses a typing alias deprecated in Python 3.14; not ours to fix.
    "ignore:'_UnionGenericAlias' is deprecated:DeprecationWarning:google.genai",
]
